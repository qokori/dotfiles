# Floating utilities
windowrule = float on, center on, match:class pavucontrol
windowrule = float on, center on, match:class blueman-manager
windowrule = float on, center on, match:modal true

# Scratchpads
windowrule = float on, center on, size (monitor_w*0.7) (monitor_h*0.7), match:workspace special:term
windowrule = float on, center on, size (monitor_w*0.6) (monitor_h*0.5), match:workspace special:music
windowrule = float on, center on, size (monitor_w*0.5) (monitor_h*0.6), match:workspace special:notes

# Workspace rules
windowrule = workspace 2, match:class firefox
windowrule = workspace 3, match:class code
windowrule = workspace 3, match:class nvim-qt
windowrule = workspace 4, match:title .*Docs.*

# Cursor-centered floating
windowrule = move (cursor_x-(window_w/2)) (cursor_y-(window_h/2)), match:float true

# Focus / opacity
windowrule = opacity 1.0 0.85, match:class kitty
windowrule = opacity 1.0 0.9, match:class code
windowrule = no_blur on, match:class firefox
