$mod = SUPER
$term = kitty
$file = thunar
$menu = rofi -show drun

bind = $mod, Return, exec, kitty
bind = $mod, B, exec, firefox
bind = $mod, C, exec, code

# reload config
bind = $mod SHIFT, R, exec, hyprctl reload

# floating
bind = $mod, V, togglefloating

# fullscreen
bind = $mod, F, fullscreen

# kill window
bind = $mod, Q, killactive

# move windows to workspace 1-4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 0


bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 0


# scratchpads
## terminal
bind = $mod, grave, togglespecialworkspace, term
bind = $mod SHIFT, grave, movetoworkspace, special:term
bind = $mod CTRL, grave, movetoworkspace, 1

## music
bind = $mod, M, togglespecialworkspace, music
bind = $mod SHIFT, M, movetoworkspace, special:music
bind = $mod CTRL, M, movetoworkspace, 2

## notes
bind = $mod, N, togglespecialworkspace, notes
bind = $mod SHIFT, N, movetoworkspace, special:notes
bind = $mod CTRL, N, movetoworkspace, 3

# mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, L, exec, hyprlock

bind = $mod SHIFT, S, exec, grimblast copy area

bind = $mod, W, exec, $HOME/.config/scripts/wallpaper-sync.sh

bind = SUPER SHIFT, Space, exec, hyprctl switchxkblayout all next

bind = $mod, D, exec, dolphin


bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-


bind = ALT, SPACE, exec, rofi -show drun
