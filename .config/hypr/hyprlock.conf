# GENERAL SETTINGS
general {
    hide_cursor = false
    ignore_empty_input = false
    immediate_render = true
    color = rgba(12, 12, 12, 1.0)  # dark fallback background
}

# BACKGROUND
background {
    monitor =
    path = screenshot          # uses a blurred screenshot of current screen
    blur_passes = 3            # stronger blur
    blur_size = 6              # blur radius
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.15
}

# PASSWORD INPUT BOX (centered)
input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    dots_size = 0.45
    dots_spacing = 0.6
    dots_rounding = -1
    outer_color = rgba(24, 24, 24, 0.85)  # dark box
    inner_color = rgba(18, 18, 18, 0.85)  # darker inner
    font_color = rgba(230, 230, 230, 0.9) # light text
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    fail_color = rgba(200, 60, 60, 0.9)   # fail red flash
    check_color = rgba(100, 200, 100, 0.9) # success green flash
    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}

# CLOCK
label {
    monitor =
    text = $TIME
    font_size = 48
    font_family = "Monospace"
    color = rgba(220, 220, 220, 0.9)
    position = 0, 70
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%d.%m.%Y, %A")"
    font_size = 22
    font_family = "Monospace"
    color = rgba(180, 180, 180, 0.9)
    position = 0, 120
    halign = center
    valign = center
}
