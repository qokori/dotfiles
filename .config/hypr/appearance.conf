$accent = rgba(585858ff)
$accent2 = rgba(7A3030ff)
$bg = rgba(292929cc)
$inactive = rgba(29292988)

general {
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $inactive
    border_size = 2
    gaps_in = 5
    gaps_out = 10
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(29292999)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}
