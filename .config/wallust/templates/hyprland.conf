$accent = rgba({{color4|strip}}ff)
$accent2 = rgba({{color2|strip}}ff)
$bg = rgba({{background|strip}}cc)
$inactive = rgba({{background|strip}}88)

general {
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $inactive
    border_size = 2
    gaps_in = 5
    gaps_out = 10
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba({{background|strip}}99)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}
